services:
  mydealz-filter:
    build: .
    container_name: mydealz-filter
    restart: unless-stopped
    ports:
      - "5102:5102"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - PUBLIC_BASE_URL=http://192.168.178.50:5102
      - POLL_INTERVAL_MINUTES=10
      - IMPRESSION_WINDOW_HOURS=6
      - CLASSIFIER_PROVIDER=scaleway
      - CLASSIFIER_MODEL=mistral-small-3.2-24b-instruct-2506
      - CLASSIFIER_MIN_DELAY=0.2
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5102/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
